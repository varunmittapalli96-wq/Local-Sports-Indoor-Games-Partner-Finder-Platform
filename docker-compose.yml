version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: playnear-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: playnear_platform_db
    volumes:
      - mongo-data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: playnear-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/playnear_platform_db
      - JWT_SECRET=super_secret_playnear_jwt_key_replace_in_production_32chars!
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:3000
      - EMAIL_FROM=no-reply@playnear.local
    depends_on:
      - mongo

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: playnear-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api/v1
    depends_on:
      - server

volumes:
  mongo-data:
